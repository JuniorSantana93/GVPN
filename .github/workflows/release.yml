name: Compilar e publicar versão

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
      - name: Configurar Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ThirdParty/proton-confgen/go.mod
      - name: Compilar helper Proton
        working-directory: ThirdParty/proton-confgen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -o build/proton-confgen.exe ./cmd/protonvpn-wg/main.go
      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Publicar executável único
        shell: pwsh
        run: dotnet publish .\GVPN.csproj -c Release -r win-x64 --self-contained true -o .\release\app
      - name: Gerar hash SHA-256
        id: checksum
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\release\app\GVPN.exe).Path
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath .\release\app\SHA256SUMS.txt -Value "$hash  GVPN.exe" -Encoding ascii
      - name: Criar release e anexar executável
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/app/GVPN.exe
            release/app/SHA256SUMS.txt
