ows:auto auto minmax(0,1fr);gap:10px;padding:12px}.connect-card{grid-template-columns:72px minmax(0,1fr) 86px 108px 120px;gap:8px;padding:12px}.power{width:64px;height:64px;font-size:42px}.server-name{font-size:clamp(17px,2vw,23px)}.split{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}.apps{gap:7px;padding-left:10px}.apps-label{font-size:10px}.chip{height:42px;max-width:calc(50% - 8px);padding:0 8px;gap:6px}.add-app{height:42px;padding:0 10px}.app-icon{width:22px;height:22px}.content{padding:12px;grid-template-rows:auto auto minmax(0,1fr);gap:10px}.connect-card{grid-template-columns:64px minmax(120px,1fr) 72px 88px 100px;padding:10px;gap:7px}.power{width:58px;height:58px;font-size:38px}.server-name{font-size:20px}.split{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}.apps{border-left:1px solid #354253;padding-left:10px}.login-wrap{grid-template-columns:.8fr 1fr}.hero-title{font-size:38px}.filters{flex-wrap:wrap;padding:8px 14px 12px;gap:8px}.filters label{margin-left:6px}.filters select{min-width:145px;flex:1}.filters .refresh{margin-left:auto}.table-head,.row{grid-template-columns:minmax(170px,2fr) minmax(66px,.6fr) minmax(110px,1.2fr) minmax(70px,.6fr)}.table-head{padding:0 12px}.row{padding:0 12px}.server{gap:8px}.flag{width:38px;height:26px}.load{gap:6px}}

<script>
(()=>{'use strict';let state={},page='connection';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const post=(action,data={})=>window.chrome?.webview?.postMessage({action,...data});const icon=`<svg class="brandmark" viewBox="0 0 178 52" role="img" aria-label="GVPN"><defs><linearGradient id="gvpn-mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10f0b0"/><stop offset="1" stop-color="#00c88c"/></linearGradient></defs><g fill="none" stroke="url(#gvpn-mark)" stroke-width="5.5" stroke-linecap="square" stroke-linejoin="round"><path d="M43 7H16L9 11v17c0 8 6 14 16 19 10-5 16-11 16-19v-5H24"/><path d="M24 23h17"/></g><text x="62" y="39" fill="#f4f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="800" letter-spacing=".5">VPN</text></svg>`;const icons={home:'<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H5V10"/><path d="M9 20v-7h6v7"/></svg>',servers:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>',split:'<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 6h4a4 4 0 0 1 4 4v2M12 16v-2a4 4 0 0 0-4-4H6"/></svg>',settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 1.4 1.1-1.4 2.4-1.8-.6a8 8 0 0 1-1.7 1l-.3 1.9h-2.8l-.3-1.9a8 8 0 0 1-1.7-1l-1.8.6-1.4-2.4L7 15a8 8 0 0 1 0-2l-1.4-1.1L7 9.5l1.8.6a8 8 0 0 1 1.7-1l.3-1.9h2.8l.3 1.9a8 8 0 0 1 1.7 1l1.8-.6 1.4 2.4L19.4 13a8 8 0 0 1 0 2Z" transform="translate(-1 -1)"/></svg>',account:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>'};function render(s){state=s||state;const app=document.getElementById('app');if(!state.authenticated){if(!app.classList.contains('login-wrap')){app.className='login-wrap';app.innerHTML=loginMarkup()}updateLogin();wireLogin();return}app.className='shell';app.innerHTML=page==='settings'?settingsMarkup():dashboardMarkup();if(page==='settings')wireSettings();else wireDashboard();}function loginMarkup(){return `<div class="login-art"><div class="login-brand">${icon}</div><div class="hero-badge">Proteção simples. Conexão privada.</div><h1 class="hero-title">Sua conexão segura começa aqui.</h1><p class="hero-text">Entre com sua conta Proton VPN para ver os servidores disponíveis no seu plano e conectar com segurança.</p><div class="feature-list"><div class="feature"><b>◉</b> WireGuard</div><div class="feature"><b>⌁</b> Split Tunneling</div><div class="feature"><b>◇</b> IPv6</div></div></div><div class="login-card-wrap"><form class="login-card" id="loginForm"><h2>Entrar na sua conta</h2><p>A autenticação é feita diretamente com a Proton VPN.</p><div class="field"><label for="username">USUÁRIO OU E-MAIL</label><input id="username" autocomplete="username" spellcheck="false" placeholder="seu usuário ou e-mail"></div><div class="field"><label for="password">SENHA</label><input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha"></div><div class="save-row"><input id="saveLogin" type="checkbox"><label for="saveLogin">Salvar login neste computador</label></div><div id="extraAuth"></div><div id="loginError"></div><button class="login-button" id="loginButton" type="submit">ENTRAR COM PROTON</button><p class="login-foot">Sua senha é usada apenas para autenticação e protegida localmente pelo Windows quando você salva o login.</p><div class="login-help">A conta Proton pode solicitar código de verificação ou CAPTCHA.</div></form></div>`}function updateLogin(){const user=document.getElementById('username'),save=document.getElementById('saveLogin'),err=document.getElementById('loginError'),btn=document.getElementById('loginButton');if(user&&!user.value)user.value=state.username||'';const pass=document.getElementById('password');if(pass&&!pass.value)pass.value=state.savedPassword||'';if(save)save.checked=!!state.saveLogin;if(err)err.innerHTML=state.error?`<div class="login-error">${esc(state.error)}</div>`:'';if(btn){btn.disabled=!!state.busy;btn.textContent=state.busy?'AUTENTICANDO COM PROTON…':'ENTRAR COM PROTON'}const extra=document.getElementById('extraAuth');if(extra&&state.twoFactor&&!document.getElementById('twoFactor'))extra.innerHTML='<div class="field"><label for="twoFactor">CÓDIGO DE VERIFICAÇÃO</label><input id="twoFactor" inputmode="numeric" autocomplete="one-time-code" placeholder="Código de 2 fatores"></div>';if(extra&&state.captcha&&!document.getElementById('captchaToken'))extra.innerHTML='<div class="field"><label for="captchaToken">TOKEN DE VERIFICAÇÃO</label><input id="captchaToken" placeholder="Cole o token da Proton"></div>'}function wireLogin(){const f=document.getElementById('loginForm');if(!f||f.dataset.wired)return;f.dataset.wired='1';f.addEventListener('submit',e=>{e.preventDefault();post('login',{username:document.getElementById('username').value,password:document.getElementById('password').value,saveLogin:document.getElementById('saveLogin').checked,twoFactor:document.getElementById('twoFactor')?.value||'',captchaToken:document.getElementById('captchaToken')?.value||''})})}function dashboardMarkup(){const active=state.activeServer||{};const connected=!!state.connected;const failed=/FALHA|ERRO/i.test(state.status||'');const servers=state.servers||[];const regions=['Todas as regiões',...new Set(servers.map(x=>x.countryName||x.country).filter(Boolean))];return `<aside class="sidebar"><div class="brand">${icon}</div><nav class="nav"><button class="active" data-nav="connection">${icons.home} Conexão</button><button data-nav="settings">${icons.settings} Configurações</button></nav></aside><main class="main"><header class="topbar"><div class="account"><div class="avatar">♙</div><span>${esc(state.username||'Conta Proton')} <span style="color:#62758a">·</span> <span class="plan">${esc(state.plan||'Plano Free')}</span></span></div><button class="top-btn" data-action="settings">⚙ &nbsp; Configurações</button><button class="top-btn" data-action="logout">⇥ &nbsp; Sair</button></header><section class="content"><article class="connect-card"><div class="power ${connected?'is-connected':'is-disconnected'}"><svg class="power-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5v19"/><path d="M13 11.5a19 19 0 1 0 22 0"/></svg></div><div><div class="status">${connected?'● VPN CONECTADA':esc(state.status||'VPN DESCONECTADA')}</div><div class="server-name">${connected?esc(active.name||'Servidor'):esc(active.name||'Escolha um servidor')}${connected&&active.city?' · '+esc(active.city):''}</div><div class="subline" style="${failed?'color:var(--red)':''}">${connected?'Seu tráfego está seguro e criptografado.':failed?esc(state.statusText||state.status):state.busy?esc(state.statusText||state.status||'Conectando…'):'Selecione um servidor e conecte com um clique.'}</div></div><div class="metric"><div class="metric-label">Latência</div><div class="metric-value" style="color:var(--green)">${connected?esc(active.pingDisplay||'—'):'—'}</div><div class="metric-note">Ping</div></div><div class="metric"><div class="metric-label">Tempo conectado</div><div class="metric-value">${esc(state.duration||'00:00:00')}</div></div><button class="disconnect" data-action="${connected?'disconnect':'connect'}" ${state.busy||(!connected&&!state.selected)?'disabled':''}>${connected?'⏻  Desconectar':state.busy?'Conectando…':'⏻  Conectar'}</button></article><article class="split" id="splitPanel"><div class="split-title"><div class="split-icon" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M7 32h12c17 0 17-20 35-20h3m-8-8 8 8-8 8M19 32c17 0 17 20 35 20h3m-8-8 8 8-8 8" fill="none" stroke="#20e9d0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><strong>Split Tunneling</strong><p>Escolha quais programas usarão o túnel VPN.</p></div></div><div class="apps"><div class="apps-label">PROGRAMAS PELO TÚNEL</div>${(state.apps||[]).map((a,i)=>`<div class="chip" title="${esc(a.path)}">${a.icon?`<img class="app-icon" src="${a.icon}" alt="">`:`<span class="app-icon app-icon-fallback">${esc(a.name.slice(0,1).toUpperCase())}</span>`}<span>${esc(a.name)}</span><button data-remove="${i}" title="Remover">×</button></div>`).join('')}<button class="add-app" data-action="add-app">＋ &nbsp; Adicionar programa</button></div></article><article class="server-panel" id="serverPanel"><div class="server-head"><span class="server-icon">▤</span><h2>Servidores da sua assinatura</h2></div><div class="filters"><span>Ordenar por:</span><select id="sort"><option>Ordem alfabética</option><option>Região</option><option>Ping (menor primeiro)</option></select><label for="region">Filtrar região:</label><select id="region">${regions.map((r,i)=>`<option value="${i?esc(r):''}">${esc(r)}</option>`).join('')}</select><button class="refresh" data-action="refresh">⟳ &nbsp; Atualizar</button></div><div class="table-head"><span>SERVIDOR</span><span>PLANO</span><span>CARGA</span><span>PING</span></div><div class="table-body" id="serverRows"></div></article></section></main>`}function settingsMarkup(){const x=state.settings||{};return `<aside class="sidebar"><div class="brand">${icon}</div><nav class="nav"><button data-nav="connection">${icons.home} Conexão</button><button class="active" data-nav="settings">${icons.settings} Configurações</button></nav></aside><main class="main"><header class="topbar"><div class="account"><div class="avatar">♙</div><span>${esc(state.username||'Conta Proton')} · <span class="plan">${esc(state.plan||'Plano Free')}</span></span></div><button class="top-btn" data-action="logout">⇥ &nbsp; Sair</button></header><section class="settings-content"><div class="settings-intro"><div class="settings-kicker">PREFERÊNCIAS DO APLICATIVO</div><h1>Configurações</h1><p>Controle as atualizações e o comportamento do GVPN.</p></div><div class="settings-grid"><article class="settings-card update-card"><div class="settings-card-head"><div class="settings-icon">⟳</div><div><div class="settings-kicker">GVPN PARA WINDOWS</div><h2>Atualizações</h2></div><span class="version-badge">v${esc(state.currentVersion||'—')}</span></div><p class="settings-description">Mantenha o aplicativo atualizado com as versões publicadas no GitHub.</p><label class="settings-toggle"><span class="toggle-copy"><b>Verificar ao iniciar</b><small>Consultar automaticamente se há uma versão nova quando o GVPN abrir.</small></span><input id="checkUpdatesOnStartup" type="checkbox" ${x.checkUpdatesOnStartup?'checked':''}><i></i></label><div class="update-status ${state.updateAvailable?'update-ready':''}">${esc(state.updateStatus||'A verificação automática será feita ao iniciar.')}</div><div class="settings-actions"><button class="secondary-action" data-action="check-updates">⟳ &nbsp; Verificar agora</button>${state.updateAvailable?`<button class="primary-action" data-action="open-update">Baixar v${esc(state.latestVersion)} &nbsp; ↗</button>`:''}</div></article><article class="settings-card"><div class="settings-card-head"><div class="settings-icon">⚙</div><div><div class="settings-kicker">COMPORTAMENTO</div><h2>Inicialização e janela</h2></div></div><div class="settings-options"><label class="settings-toggle"><span class="toggle-copy"><b>Iniciar com o Windows</b><small>Abrir o GVPN automaticamente ao entrar no Windows.</small></span><input id="startWithWindows" type="checkbox" ${x.startWithWindows?'checked':''}><i></i></label><label class="settings-toggle"><span class="toggle-copy"><b>Iniciar minimizado</b><small>Iniciar sem ocupar a área de trabalho.</small></span><input id="startMinimized" type="checkbox" ${x.startMinimized?'checked':''}><i></i></label><label class="settings-toggle"><span class="toggle-copy"><b>Fechar para a bandeja</b><small>Manter o GVPN ativo quando fechar ou minimizar a janela.</small></span><input id="closeToTray" type="checkbox" ${x.closeToTray?'checked':''}><i></i></label></div><div class="settings-note">A inicialização do Windows pode solicitar confirmação de permissões do sistema.</div><button class="primary-action save-settings" id="saveSettings">Salvar configurações</button></article></div></section></main>`}function wireSettings(){document.getElementById('saveSettings').onclick=()=>post('save-settings',{startWithWindows:document.getElementById('startWithWindows').checked,startMinimized:document.getElementById('startMinimized').checked,closeToTray:document.getElementById('closeToTray').checked,checkUpdatesOnStartup:document.getElementById('checkUpdatesOnStartup').checked});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page='connection';render(state)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>post(b.dataset.action))}function wireDashboard(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===b));const target=b.dataset.nav;if(target==='servers')document.getElementById('serverPanel').scrollIntoView({behavior:'smooth',block:'start'});else if(target==='split')document.getElementById('splitPanel').scrollIntoView({behavior:'smooth',block:'center'});else if(target==='settings'){page='settings';render(state)}else if(target==='account')post('account');else window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='settings'){page='settings';render(state)}else post(b.dataset.action)});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>post('remove-app',{index:+b.dataset.remove}));const sort=document.getElementById('sort'),region=document.getElementById('region');sort.value=state.sort||'Ordem alfabética';region.value=state.region||'';sort.onchange=()=>{drawRows();post('sort',{value:sort.value})};region.onchange=()=>{drawRows();post('region',{value:region.options[region.selectedIndex]?.text||''})};drawRows();}function drawRows(){const list=[...(state.servers||[])],sort=document.getElementById('sort').value,region=document.getElementById('region').value,connected=!!state.connected;let visible=list.filter(s=>!region||(s.countryName||s.country)===region);if(sort==='Região')visible.sort((a,b)=>(a.countryName||a.country).localeCompare(b.countryName||b.country)||a.city.localeCompare(b.city));else if(sort.startsWith('Ping'))visible.sort((a,b)=>(a.pingMs??999999)-(b.pingMs??999999));else visible.sort((a,b)=>a.name.localeCompare(b.name));const rows=document.getElementById('serverRows');rows.innerHTML=visible.map((s,i)=>`<div class="row ${state.selected===s.name?'selected':''}" data-server="${esc(s.name)}"><div class="server"><i class="radio"></i><img class="flag" src="${esc(s.flag)}" alt="${esc(s.country)}"><div class="server-detail"><strong>${esc(s.name)}</strong><small>${esc(s.city)}, ${esc(s.countryName||s.country)}</small></div></div><span class="tier">${esc(s.tier||'Free')}</span><div class="load"><div class="bar"><i style="width:${Math.min(100,Math.max(0,s.load||0))}%"></i></div><span>${s.load||0}%</span></div><span class="ping ${(s.pingMs||0)>80?'slow':''}">${esc(s.pingDisplay||'—')}</span></div>`).join('')||(state.busy?'<div class="empty">Carregando servidores Proton…</div>':'<div class="empty">Nenhum servidor disponível para este filtro.</div>');rows.querySelectorAll('[data-server]').forEach(el=>el.onclick=()=>{state.selected=el.dataset.server;drawRows();post('select-server',{name:state.selected})})}window.gvpn={render,updateDuration(v){const el=document.querySelector('.metric-value:nth-child(2)');const all=document.querySelectorAll('.metric .metric-value');if(all.length>1)all[1].textContent=v}};window.chrome?.webview?.addEventListener('message',e=>{if(e.data&&e.data.type==='state')render(e.data.state);else if(e.data&&e.data.type==='toast')toast(e.data.message)});function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3000)}})();
</script>
</body></html>
